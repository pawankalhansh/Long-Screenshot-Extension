<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot Result</title>
  <link rel="stylesheet" href="result.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z"/><path d="M12 8v8M8 12h8"/></svg>
      <h1>Screenshot Ready</h1>
    </div>
    <div class="actions">
      <button id="copy-image" class="btn secondary">Copy Image</button>
      <button id="download-png" class="btn primary">Download PNG</button>
      <button id="download-jpg" class="btn secondary">Download JPG</button>
    </div>
  </div>
  <div class="editor-toolbar">
    <div class="tools-left">
      <div class="tool-group">
        <button class="tool-btn active" id="tool-pen" title="Draw (Pen)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
        </button>
        <button class="tool-btn" id="tool-highlight" title="Highlighter">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l-5 5v3h3l5-5M9 11l6-6h4v4l-6 6M9 11l4 4"/></svg>
        </button>
        <button class="tool-btn" id="tool-eraser" title="Eraser">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16C2.5 15.5 2.5 14.5 3 14L13 4C13.5 3.5 14.5 3.5 15 4L20 9C20.5 9.5 20.5 10.5 20 11L11 20"/></svg>
        </button>
        <button class="tool-btn" id="tool-rect" title="Rectangle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
        </button>
        <button class="tool-btn" id="tool-circle" title="Circle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
        </button>
        <button class="tool-btn" id="tool-line" title="Straight Line">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="20" x2="20" y2="4"/></svg>
        </button>
        <button class="tool-btn" id="tool-arrow" title="Arrow">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="20" x2="20" y2="4"/><polyline points="14 4 20 4 20 10"/></svg>
        </button>
      </div>

      <div class="divider"></div>

      <div class="tool-group">
        <button class="tool-btn" id="tool-crop" title="Crop">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.13 1L6 16a2 2 0 0 0 2 2h15"/><path d="M1 6.13L16 6a2 2 0 0 1 2 2v15"/></svg>
        </button>
        <button class="tool-btn" id="tool-scan" title="Scan for Text (OCR)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h3M17 4h3v3M4 17v3h3M17 20h3v-3"/><text x="12" y="16" font-size="12" text-anchor="middle" font-family="sans-serif" stroke="none" fill="currentColor">T</text></svg>
        </button>
      </div>
      
      <div class="divider"></div>
      
      <div class="tool-group dropdown-group">
        <button class="dropdown-btn" id="btn-outline">
          <span class="color-indicator" id="indicator-outline" style="background: #ff0000;"></span>
          Outline
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button class="dropdown-btn" id="btn-fill">
          <span class="color-indicator transparent" id="indicator-fill"></span>
          Fill
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>

        <!-- Premium Dropdown Menu -->
        <div class="dropdown-menu" id="color-menu">
          <div class="menu-title" id="menu-title">Colors</div>
          <div class="color-grid">
            <button class="color-swatch transparent active" data-color="transparent" title="No Color">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
            </button>
            <button class="color-swatch" data-color="#000000" style="background: #000000;"></button>
            <button class="color-swatch" data-color="#ffffff" style="background: #ffffff; border: 1px solid #ddd;"></button>
            <button class="color-swatch" data-color="#a0a0a0" style="background: #a0a0a0;"></button>
            <button class="color-swatch" data-color="#ff0000" style="background: #ff0000;"></button>
            <button class="color-swatch" data-color="#ff8c00" style="background: #ff8c00;"></button>
            <button class="color-swatch" data-color="#ffd700" style="background: #ffd700;"></button>
            <button class="color-swatch" data-color="#008000" style="background: #008000;"></button>
            <button class="color-swatch" data-color="#0000ff" style="background: #0000ff;"></button>
            <button class="color-swatch" data-color="#800080" style="background: #800080;"></button>
            <button class="color-swatch" data-color="#ff69b4" style="background: #ff69b4;"></button>
            <button class="color-swatch" data-color="#00ced1" style="background: #00ced1;"></button>
          </div>
          
          <div class="menu-section">
            <label>Thickness</label>
            <input type="range" id="menu-size-picker" min="1" max="50" value="4">
          </div>
        </div>
      </div>
    </div>

    <div class="tools-right">
      <button class="tool-btn" id="btn-undo" title="Undo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10h10a5 5 0 0 1 5 5v2"/><path d="M3 10l4-4"/><path d="M3 10l4 4"/></svg>
      </button>
      <button class="tool-btn" id="btn-redo" title="Redo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10H11a5 5 0 0 0-5 5v2"/><path d="M21 10l-4-4"/><path d="M21 10l-4 4"/></svg>
      </button>
    </div>
  </div>

  <div class="main-content">
    <div class="preview-container" id="preview-container">
      <div id="loading" class="loading">Processing image...</div>
      <div class="canvas-wrapper">
        <canvas id="result-canvas"></canvas>
        <canvas id="annotation-canvas"></canvas>
      </div>
    </div>
  </div>

  <div id="ocr-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Extracted Text</h2>
        <button id="close-modal" class="tool-btn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <textarea id="ocr-result-text" readonly></textarea>
      <div class="modal-footer">
        <button id="copy-ocr-text" class="btn primary">Copy Text</button>
      </div>
    </div>
  </div>

  <script src="tesseract/tesseract.min.js"></script>
  <script src="result.js"></script>
  <script src="editor.js"></script>
</body>
</html>
